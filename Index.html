computed: {
hasilPesan() {
if (this.benar === 100) {
return "Luar biasa! Semua jawaban benar! 🏆";
} else if (this.benar >= 70) {
return "Hebat! Pengetahuanmu bagus!";
} else if (this.benar >= 40) {
return "Bagus! Terus belajar!";
} else {
return "Ayo belajar dan coba lagi!";
}
}
},

methods: {
cekJawaban(option) {
if (this.dijawab) return;

this.dijawab = true;
this.jawaban = option;
this.stopTimer();

if (option === this.questions[this.index].answer) {
this.skor += 10;
this.benar++;
this.pesan = "Benar! 🎉";
} else {
this.pesan = "Salah! Jawaban: " +
this.questions[this.index].answer;
}

},

soalBerikutnya() {
if (this.index < this.questions.length - 1) {
this.index++;
this.dijawab = false;
this.jawaban = null;
this.pesan = "";
this.mulaiTimer();
} else {
this.selesai = true;
this.stopTimer();
}
},

mulaiTimer() {
this.stopTimer();
this.waktu = 15;

this.timer = setInterval(() => {
if (this.waktu > 0) {
this.waktu--;
} else {
this.dijawab = true;
this.pesan = "Waktu habis! ⏰ Jawaban: " +
this.questions[this.index].answer;
this.stopTimer();
}
}, 1000);

},

stopTimer() {
clearInterval(this.timer);
this.timer = null;
},

ulangGame() {
this.stopTimer();
this.index = 0;
this.skor = 0;
this.benar = 0;
this.waktu = 15;
this.dijawab = false;
this.jawaban = null;
this.pesan = "";
this.selesai = false;
this.mulaiTimer();
}

},

mounted() {
this.mulaiTimer();
},

beforeUnmount() {
this.stopTimer();
}
